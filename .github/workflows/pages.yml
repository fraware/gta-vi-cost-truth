name: Publish website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Pages configuration
        id: configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --silent >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Enable Pages in Settings > Pages, select GitHub Actions as the build source, then rerun this workflow."
          fi
      - uses: actions/configure-pages@v5
        if: steps.configuration.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.configuration.outputs.enabled == 'true'
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
        if: steps.configuration.outputs.enabled == 'true'
